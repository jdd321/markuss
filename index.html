<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markus Rosali</title>
<meta name="description" content="Follow Markus Rosali on Facebook, Instagram and TikTok.">
<meta name="theme-color" content="#1D1D1F">

<style>
:root{
  /* Palette from the LYNQ logo: pure monochrome ink. Accent = black (white in dark mode) */
  --text:#1D1D1F; --muted:#515154; --accent:#000; --wash:rgba(245,245,247,.6);
  --card:rgba(255,255,255,.3); --chip:rgba(255,255,255,.7); --hi:rgba(255,255,255,.8);
  --e1:rgba(255,255,255,.95); --e2:rgba(255,255,255,.12); --sh:rgba(30,30,40,.14); --glow:rgba(255,255,255,.55);
  --head:"Chakra Petch",-apple-system,"SF Pro Display",Inter,"Helvetica Neue",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#F5F5F7;--muted:#B4B4BA;--accent:#fff;--wash:rgba(0,0,0,.58);--card:rgba(255,255,255,.08);--chip:rgba(255,255,255,.14);--hi:rgba(255,255,255,.2);--e1:rgba(255,255,255,.5);--e2:rgba(255,255,255,.05);--sh:rgba(0,0,0,.5);--glow:rgba(255,255,255,.22)}}
:root[data-theme="dark"]{--text:#F5F5F7;--muted:#B4B4BA;--accent:#fff;--wash:rgba(0,0,0,.58);--card:rgba(255,255,255,.08);--chip:rgba(255,255,255,.14);--hi:rgba(255,255,255,.2);--e1:rgba(255,255,255,.5);--e2:rgba(255,255,255,.05);--sh:rgba(0,0,0,.5);--glow:rgba(255,255,255,.22)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#d9d6d0}
body{margin:0;color:var(--text);font-family:-apple-system,"SF Pro Text",Inter,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}

/* Background: Markus's photo, blurred into a slowly looping color field (Apple Music style) */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:#d9d6d0}
.bg img{position:absolute;left:-30%;top:-30%;width:160%;height:160%;object-fit:cover;filter:blur(64px) saturate(1.7);will-change:transform}
.bg .a{animation:sway 22s ease-in-out infinite alternate}
.bg .b{opacity:.55;transform:scaleX(-1);animation:sway2 30s ease-in-out infinite alternate;mix-blend-mode:soft-light}
.bg::after{content:"";position:absolute;inset:0;background:var(--wash)}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E")}

main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:64px 20px 28px;display:flex;flex-direction:column;align-items:center;min-height:100vh}

/* Profile: slowly turning ring with a gap, echoing the logo's open outline */
.avatar{position:relative;width:176px;height:176px;animation:reveal 1s cubic-bezier(.2,.8,.2,1) both}
.avatar img{position:absolute;inset:14px;width:148px;height:148px;border-radius:50%;object-fit:cover;box-shadow:0 24px 50px -10px var(--sh),0 0 0 4px var(--hi);background:#d2d2d7}
.avatar svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 28s linear infinite}
.avatar circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:480 72;opacity:.9}

h1{font-family:var(--head);font-weight:700;font-size:40px;letter-spacing:-.015em;line-height:1.05;margin:30px 0 10px;text-align:center;animation:reveal 1s .12s cubic-bezier(.2,.8,.2,1) both}
.tagline{margin:0 0 40px;color:var(--muted);font-size:17px;line-height:1.45;text-align:center;max-width:300px;animation:reveal 1s .2s cubic-bezier(.2,.8,.2,1) both}

.links{width:100%;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.links li{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.links li:nth-child(1){animation-delay:.34s}.links li:nth-child(2){animation-delay:.44s}.links li:nth-child(3){animation-delay:.54s}

/* Liquid-glass buttons: translucent, blurred, bright rim, light that follows the finger/cursor */
.link{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:76px;padding:0 20px 0 16px;border-radius:24px;background:var(--card);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);box-shadow:0 18px 40px -14px var(--sh),inset 0 1px 0 var(--hi);color:var(--text);text-decoration:none;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s ease;-webkit-tap-highlight-color:transparent}
.link::before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 65%);opacity:0;transition:opacity .3s ease;pointer-events:none}
.link::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(145deg,var(--e1),var(--e2) 45%,var(--e1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.chip{position:relative;flex:none;width:46px;height:46px;border-radius:15px;background:var(--chip);display:grid;place-items:center;box-shadow:inset 0 1px 0 var(--hi),0 4px 10px -4px var(--sh)}
.chip svg{width:25px;height:25px}
.txt{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-size:18px;font-weight:650;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{position:relative;width:18px;height:18px;flex:none;color:var(--muted);transition:transform .3s ease}
@media (hover:hover){.link:hover{transform:translateY(-3px) scale(1.012)}.link:hover::before{opacity:1}.link:hover .chev{transform:translateX(4px)}}
.link:active{transform:scale(.965);transition-duration:.12s}
.link:active::before{opacity:1}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

footer{margin-top:auto;padding-top:52px;text-align:center;color:var(--muted);font-size:13px;animation:rise .8s .7s cubic-bezier(.2,.8,.2,1) both}
footer p{margin:0 0 12px}
.credit{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--card);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 var(--hi);color:var(--muted);text-decoration:none;font-size:12px}
.credit svg{height:20px;width:auto;color:var(--text)}
.credit:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@keyframes reveal{from{opacity:0;filter:blur(14px);transform:translateY(14px) scale(.97)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:translate(-6%,-4%) rotate(0) scale(1)}to{transform:translate(8%,6%) rotate(14deg) scale(1.12)}}
@keyframes sway2{from{transform:scaleX(-1) translate(6%,5%) rotate(0) scale(1.1)}to{transform:scaleX(-1) translate(-8%,-6%) rotate(-16deg) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
